<!doctype html>
<html lang="en">
    <head>
        <title>MiroTalk WebRTC Viewer</title>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="apple-touch-icon" href="../assets/images/favicon.png" />
        <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico" />

        <meta property="og:type" content="app-webrtc-broadcasting" />
        <meta property="og:site_name" content="MiroTalk BRO Viewer" />
        <meta property="og:title" content="Click the link to make a call." />
        <meta property="og:description" content="MiroTalk WebRTC Live Broadcast" />
        <meta property="og:image" content="https://bro.mirotalk.com/assets/images/ui.png" />
        <meta property="og:url" content="https://bro.mirotalk.com" />

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="../css/common.css" />
        <link rel="stylesheet" href="../css/viewer.css" />
    </head>
    <body>
        <div id="viewerVideoContainer" aria-label="Your camera preview">
            <video id="viewerVideo" class="fadeIn" autoplay muted playsinline></video>
        </div>
        <div id="viewerForm" class="viewer room fadeIn">
            <header id="viewerFormHeader" class="viewer-header room-header not-selectable">
                <div class="viewer-info room-meta">
                    <span class="live-badge">LIVE</span>
                    <span id="rtmpBadge" class="source-badge"
                        ><i class="fas fa-satellite-dish" aria-hidden="true"></i> RTMP</span
                    >
                    <span class="meta-item meta-user" title="Your name">
                        <i class="fas fa-user" aria-hidden="true"></i><span id="myName">Viewer</span>
                    </span>
                    <span class="meta-item" title="Time watching">
                        <i class="fas fa-clock" aria-hidden="true"></i><span id="sessionTime">0s</span>
                    </span>
                </div>
                <div class="viewer-header-buttons">
                    <button id="leave" class="room-leave" type="button" aria-label="Leave broadcast">
                        <i class="fas fa-right-from-bracket" aria-hidden="true"></i><span>Leave</span>
                    </button>
                </div>
            </header>
            <main class="container">
                <video id="mainVideo" class="not-selectable"></video>
                <img id="videoOff" class="video-off" src="../assets/images/videoOff.png" alt="Broadcaster camera off" />
                <div id="awaitingBroadcaster" class="awaiting-broadcaster center pulse" role="status">
                    Waiting for the broadcaster to go live...
                </div>
                <div id="reconnectingOverlay" class="reconnecting-overlay" role="status">
                    <div class="spinner"></div>
                    <span>Reconnecting...</span>
                </div>
            </main>
            <label id="recordingLabel" class="rec-indicator pulse" role="status"
                >REC <span id="recordingTime">0S</span></label
            >
            <nav id="viewerButtons" class="viewer-buttons control-dock" aria-label="Viewer controls">
                <button id="disableAudio" type="button" aria-label="Disable your audio">
                    <i class="fas fa-microphone"></i>
                </button>
                <button id="enableAudio" class="color-red" type="button" aria-label="Enable your audio">
                    <i class="fas fa-microphone-slash"></i>
                </button>
                <button id="videoBtn" type="button" aria-label="Toggle your video"><i class="fas fa-video"></i></button>
                <button id="recordingStart" type="button" aria-label="Start recording">
                    <i class="fas fa-record-vinyl"></i>
                </button>
                <button id="recordingStop" class="color-red" type="button" aria-label="Stop recording">
                    <i class="fas fa-stop"></i>
                </button>
                <button id="snapshot" type="button" aria-label="Take a snapshot">
                    <i class="fas fa-camera-retro"></i>
                </button>
                <button id="togglePIP" type="button" aria-label="Toggle picture in picture">
                    <i class="fas fa-images"></i>
                </button>
                <button id="messagesBtn" type="button" aria-label="Toggle messages" aria-controls="messagesForm">
                    <i class="fas fa-message"></i>
                </button>
                <button id="fullScreenOn" type="button" aria-label="Enable full screen">
                    <i class="fas fa-expand-alt"></i>
                </button>
                <button id="fullScreenOff" type="button" aria-label="Disable full screen">
                    <i class="fas fa-compress-alt"></i>
                </button>
                <button id="qualitySelect" type="button" aria-label="Video quality">
                    <i class="fas fa-sliders-h"></i>
                </button>
                <button id="settingsBtn" type="button" aria-label="Toggle settings" aria-controls="settingsForm">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </nav>
        </div>
        <aside
            id="settingsForm"
            class="viewer-settings panel-drawer fadeIn"
            role="dialog"
            aria-labelledby="settingsTitle"
        >
            <div class="viewer-settings-header panel-header">
                <h2 id="settingsTitle" class="panel-title">
                    <i class="fa-solid fa-gear" aria-hidden="true"></i><span>Settings</span>
                </h2>
                <button id="settingsCloseBtn" class="panel-close-btn" type="button" aria-label="Close settings">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="viewer-settings-body panel-body">
                <div id="audioOutputSection" class="form-section">
                    <label for="audioOutputSelect" class="form-label not-selectable">
                        <i class="fas fa-volume-high" aria-hidden="true"></i> Speaker
                    </label>
                    <div class="control-row">
                        <select id="audioOutputSelect"></select>
                        <button id="audioOutputTestBtn" class="square-btn" type="button" title="Test speaker">
                            <i class="fas fa-play" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
            </div>
        </aside>
        <aside id="messagesForm" class="viewer-messages panel-drawer" role="dialog" aria-labelledby="messagesTitle">
            <div class="viewer-messages-header panel-header">
                <h2 id="messagesTitle" class="panel-title">
                    <i class="fas fa-message" aria-hidden="true"></i><span>Messages</span>
                </h2>
                <div class="panel-toolbar">
                    <button id="messagesClean" class="icon-btn" type="button" title="Clear messages">
                        <i class="fas fa-trash" aria-hidden="true"></i>
                    </button>
                    <button id="messagesSave" class="icon-btn" type="button" title="Save messages">
                        <i class="fas fa-download" aria-hidden="true"></i>
                    </button>
                    <button id="messagesCloseBtn" class="panel-close-btn" type="button" title="Close messages">
                        <i class="fas fa-times" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
            <div
                id="viewerMessagesArea"
                class="viewer-messages-area chat-feed panel-body"
                role="log"
                aria-live="polite"
            ></div>
            <div class="viewer-messages-compose chat-compose">
                <input
                    id="messageInput"
                    class="text-input"
                    maxlength="1024"
                    name="message"
                    placeholder="Write a message..."
                    aria-label="Message"
                    autocomplete="off"
                />
                <button
                    id="messageEmoji"
                    class="emoji-picker-button"
                    type="button"
                    title="Emoji"
                    aria-label="Choose an emoji"
                >
                    <i class="fa-regular fa-face-smile"></i>
                </button>
                <button id="messageSend" type="button" title="Send" aria-label="Send message">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </aside>
        <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11.4.8"></script>
        <script defer src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.11.8/umd/popper.min.js"></script>
        <script defer src="https://cdnjs.cloudflare.com/ajax/libs/tippy.js/6.3.7/tippy-bundle.umd.min.js"></script>
        <script defer src="https://cdnjs.cloudflare.com/ajax/libs/UAParser.js/1.0.37/ua-parser.min.js"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.js"></script>
        <script defer src="/socket.io/socket.io.js"></script>
        <script defer src="../js/mediasoup-client.js"></script>
        <script defer src="../js/swal.js"></script>
        <script defer src="../js/utils.js"></script>
        <script defer src="../js/config.js"></script>
        <script defer src="../js/viewer.js"></script>
        <script defer src="../js/recording.js"></script>
        <script defer src="../js/ux.js"></script>
        <script async src="../js/stats.js"></script>
    </body>
</html>
