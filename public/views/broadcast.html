<!doctype html>
<html lang="en">
    <head>
        <title>MiroTalk WebRTC Live Broadcast</title>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="apple-touch-icon" href="../assets/images/favicon.png" />
        <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico" />

        <meta property="og:type" content="app-webrtc-broadcasting" />
        <meta property="og:site_name" content="MiroTalk BRO Broadcast" />
        <meta property="og:title" content="Click the link to make a call." />
        <meta property="og:description" content="MiroTalk WebRTC Live Broadcast" />
        <meta property="og:image" content="https://bro.mirotalk.com/assets/images/ui.png" />
        <meta property="og:url" content="https://bro.mirotalk.com" />

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="../css/common.css" />
        <link rel="stylesheet" href="../css/broadcast.css" />
    </head>
    <body>
        <div id="broadcastForm" class="broadcast room fadeIn">
            <header id="broadcastFormHeader" class="broadcast-header room-header not-selectable">
                <div class="broadcast-info room-meta">
                    <span class="live-badge">LIVE</span>
                    <div id="broadcastingModeLabel" class="broadcasting-mode-badge">
                        <span class="mode-dot"></span>
                        <span class="mode-text">---</span>
                    </div>
                    <span class="meta-item meta-user">
                        <i class="fas fa-user" aria-hidden="true"></i><span id="myName">Broadcaster</span>
                    </span>
                    <span class="meta-item">
                        <i class="fas fa-users" aria-hidden="true"></i><span id="connectedPeers">0</span>
                        <span class="visually-hidden">viewers</span>
                    </span>
                    <span class="meta-item">
                        <i class="fas fa-clock" aria-hidden="true"></i><span id="sessionTime">0s</span>
                    </span>
                </div>
                <div class="broadcast-header-buttons">
                    <button id="goHome" class="room-leave" type="button" aria-label="Leave and go to home page">
                        <i class="fas fa-right-from-bracket" aria-hidden="true"></i><span>Leave</span>
                    </button>
                </div>
            </header>
            <main class="container video-loading">
                <video class="not-selectable"></video>
                <img id="videoOff" class="video-off" src="../assets/images/videoOff.png" alt="Camera off" />
                <div id="rtmpSourceStatus" class="rtmp-source-status" hidden>
                    <i class="fas fa-satellite-dish" aria-hidden="true"></i>
                    <strong>RTMP source active</strong>
                    <span>Moderator mode</span>
                </div>
                <div id="reconnectingOverlay" class="reconnecting-overlay" role="status">
                    <div class="spinner"></div>
                    <span>Reconnecting...</span>
                </div>
            </main>
            <label id="recordingLabel" class="rec-indicator pulse" role="status"
                >REC <span id="recordingTime">0S</span></label
            >
            <nav id="broadcastButtons" class="broadcast-buttons control-dock" aria-label="Broadcast controls">
                <button id="copyRoom" type="button" aria-label="Copy room URL"><i class="fas fa-copy"></i></button>
                <button id="shareRoom" type="button" aria-label="Share room URL">
                    <i class="fas fa-share-alt"></i>
                </button>
                <button id="disableAudio" type="button" aria-label="Disable audio">
                    <i class="fas fa-microphone"></i>
                </button>
                <button id="enableAudio" class="color-red" type="button" aria-label="Enable audio">
                    <i class="fas fa-microphone-slash"></i>
                </button>
                <button id="videoBtn" type="button" aria-label="Toggle video"><i class="fas fa-video"></i></button>
                <button id="screenShareStart" type="button" aria-label="Start screen sharing">
                    <i class="fas fa-display"></i>
                </button>
                <button id="screenShareStop" class="pulse-bg" type="button" aria-label="Stop screen sharing">
                    <i class="fa-solid fa-circle-stop"></i>
                </button>
                <button id="recordingStart" type="button" aria-label="Start recording">
                    <i class="fas fa-record-vinyl"></i>
                </button>
                <button id="recordingStop" class="color-red" type="button" aria-label="Stop recording">
                    <i class="fas fa-stop"></i>
                </button>
                <button id="togglePIP" type="button" aria-label="Toggle picture in picture">
                    <i class="fas fa-images"></i>
                </button>
                <button id="fullScreenOn" type="button" aria-label="Enable full screen">
                    <i class="fas fa-expand-alt"></i>
                </button>
                <button id="fullScreenOff" type="button" aria-label="Disable full screen">
                    <i class="fas fa-compress-alt"></i>
                </button>
                <button id="messagesOpenForm" type="button" aria-label="Toggle messages" aria-controls="messagesForm">
                    <i class="fas fa-message"></i>
                </button>
                <button id="viewersOpenForm" type="button" aria-label="Toggle viewers" aria-controls="viewersForm">
                    <i class="fas fa-users"></i>
                </button>
                <button
                    id="settingsBtn"
                    type="button"
                    aria-label="Toggle settings"
                    aria-controls="broadcasterSettingsForm"
                >
                    <i class="fa-solid fa-sliders"></i>
                </button>
            </nav>
            <aside
                id="broadcasterSettingsForm"
                class="settings panel-drawer fadeIn"
                role="dialog"
                aria-labelledby="settingsTitle"
            >
                <div class="settings-panel-header panel-header">
                    <h2 id="settingsTitle" class="panel-title">
                        <i class="fa-solid fa-sliders" aria-hidden="true"></i><span>Settings</span>
                    </h2>
                    <button id="toggleSettingsBtn" class="panel-close-btn" type="button" aria-label="Close settings">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="panel-body">
                    <div class="form-section">
                        <label for="videoSelect" class="form-label not-selectable">
                            <i class="fas fa-video" aria-hidden="true"></i> Camera
                        </label>
                        <select id="videoSelect"></select>
                    </div>
                    <div class="form-section">
                        <label for="videoQualitySelect" class="form-label not-selectable">
                            <i class="fas fa-photo-film" aria-hidden="true"></i> Quality &amp; frame rate
                        </label>
                        <div class="control-row">
                            <select id="videoQualitySelect" aria-label="Video quality">
                                <option value="default">Default</option>
                                <option value="qvga">QVGA</option>
                                <option value="vga">VGA</option>
                                <option value="hd">HD</option>
                                <option value="fhd">FULL HD</option>
                                <option value="2k">2K</option>
                                <option value="4k">4K</option>
                                <option value="6k">6K</option>
                                <option value="8k">8K</option>
                            </select>
                            <select id="videoFpsSelect" aria-label="Frame rate">
                                <option value="default">Default</option>
                                <option value="60">60 fps</option>
                                <option value="30">30 fps</option>
                                <option value="25">25 fps</option>
                                <option value="20">20 fps</option>
                                <option value="15">15 fps</option>
                                <option value="10">10 fps</option>
                                <option value="5">5 fps</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-section">
                        <label for="audioSelect" class="form-label not-selectable">
                            <i class="fas fa-microphone" aria-hidden="true"></i> Microphone
                        </label>
                        <select id="audioSelect"></select>
                    </div>
                    <div id="backgroundEffectsSection" class="form-section">
                        <label for="backgroundEffectSelect" class="form-label not-selectable">
                            <i class="fas fa-image" aria-hidden="true"></i> Background
                        </label>
                        <div class="background-effect-control">
                            <select id="backgroundEffectSelect" disabled>
                                <option value="off">Off</option>
                                <option value="blur">Blur</option>
                                <option value="image">Image</option>
                            </select>
                            <span
                                id="backgroundEffectLoading"
                                class="background-effect-loading"
                                role="status"
                                aria-label="Loading background"
                                hidden
                            >
                                <i class="fas fa-circle-notch fa-spin" aria-hidden="true"></i>
                            </span>
                        </div>
                        <input
                            id="backgroundImageInput"
                            type="file"
                            accept="image/png,image/jpeg,image/webp"
                            aria-label="Background image"
                            hidden
                        />
                    </div>
                    <div id="audioOutputSection" class="form-section">
                        <label for="audioOutputSelect" class="form-label not-selectable">
                            <i class="fas fa-volume-high" aria-hidden="true"></i> Speaker
                        </label>
                        <div class="control-row">
                            <select id="audioOutputSelect"></select>
                            <button id="audioOutputTestBtn" class="square-btn" type="button" aria-label="Test speaker">
                                <i class="fas fa-play" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </aside>
            <aside id="messagesForm" class="messages panel-drawer fadeIn" role="dialog" aria-labelledby="messagesTitle">
                <div id="messagesFormHeader" class="messages-header panel-header">
                    <h2 id="messagesTitle" class="panel-title">
                        <i class="fas fa-message" aria-hidden="true"></i><span>Messages</span>
                    </h2>
                    <div class="panel-toolbar">
                        <button id="messagesSave" class="icon-btn" type="button" aria-label="Save messages">
                            <i class="fas fa-download"></i>
                        </button>
                        <button id="messagesOpenViewersForm" class="icon-btn" type="button" aria-label="Show viewers">
                            <i class="fas fa-users"></i>
                        </button>
                        <button id="messagesClean" class="icon-btn" type="button" aria-label="Clear messages">
                            <i class="fas fa-trash"></i>
                        </button>
                        <button
                            id="messagesCloseForm"
                            class="panel-close-btn"
                            type="button"
                            aria-label="Close messages"
                        >
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
                <div
                    id="messagesArea"
                    class="messages-incoming chat-feed panel-body"
                    role="log"
                    aria-live="polite"
                ></div>
                <div class="messages-compose chat-compose">
                    <input
                        id="messageInput"
                        class="text-input"
                        maxlength="1024"
                        name="message"
                        placeholder="Write a message..."
                        aria-label="Message"
                        autocomplete="off"
                    />
                    <button id="messageEmoji" class="emoji-picker-button" type="button" aria-label="Choose an emoji">
                        <i class="fa-regular fa-face-smile"></i>
                    </button>
                    <button id="messageSend" type="button" aria-label="Send message">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </aside>
            <aside id="viewersForm" class="viewers panel-drawer fadeIn" role="dialog" aria-labelledby="viewersTitle">
                <div id="viewersHeader" class="viewers-header panel-header">
                    <h2 id="viewersTitle" class="panel-title">
                        <i class="fas fa-users" aria-hidden="true"></i><span>Viewers</span>
                    </h2>
                    <div class="panel-toolbar">
                        <button id="viewerOpenMessageForm" class="icon-btn" type="button" aria-label="Show messages">
                            <i class="fas fa-message"></i>
                        </button>
                        <button id="viewersSave" class="icon-btn" type="button" aria-label="Save viewers list">
                            <i class="fas fa-download"></i>
                        </button>
                        <button id="viewersCloseForm" class="panel-close-btn" type="button" aria-label="Close viewers">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
                <div class="viewers-tools">
                    <div class="search-field">
                        <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
                        <input
                            id="viewerSearch"
                            class="text-input"
                            type="text"
                            placeholder="Search viewers..."
                            name="search"
                            aria-label="Search viewers"
                            autocomplete="off"
                        />
                    </div>
                    <div class="viewers-bulk" role="group" aria-label="Actions for all viewers">
                        <span class="viewers-bulk-label">All viewers</span>
                        <button id="viewersMuteAudio" type="button" aria-label="Mute all viewers microphone">
                            <i class="fas fa-microphone-slash" aria-hidden="true"></i><span>Mute</span>
                        </button>
                        <button id="viewersHideVideo" type="button" aria-label="Hide all viewers camera">
                            <i class="fas fa-video-slash" aria-hidden="true"></i><span>Hide</span>
                        </button>
                        <button
                            id="viewersDisconnect"
                            class="is-danger"
                            type="button"
                            aria-label="Disconnect all viewers"
                        >
                            <i class="fas fa-plug" aria-hidden="true"></i><span>Disconnect</span>
                        </button>
                    </div>
                </div>
                <div class="viewers-area panel-body">
                    <div id="viewersTable" class="viewers-grid"></div>
                </div>
            </aside>
        </div>
        <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11.4.8"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
        <script defer src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.11.8/umd/popper.min.js"></script>
        <script defer src="https://cdnjs.cloudflare.com/ajax/libs/tippy.js/6.3.7/tippy-bundle.umd.min.js"></script>
        <script defer src="https://cdnjs.cloudflare.com/ajax/libs/UAParser.js/1.0.37/ua-parser.min.js"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.js"></script>
        <script defer src="/socket.io/socket.io.js"></script>
        <script defer src="../js/mediasoup-client.js"></script>
        <script defer src="../js/swal.js"></script>
        <script defer src="../js/utils.js"></script>
        <script defer src="../js/config.js"></script>
        <script defer src="../js/background-effects.js"></script>
        <script defer src="../js/broadcast.js"></script>
        <script defer src="../js/recording.js"></script>
        <script defer src="../js/ux.js"></script>
        <script async src="../js/stats.js"></script>
    </body>
</html>
